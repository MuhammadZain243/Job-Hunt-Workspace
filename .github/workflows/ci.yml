name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          MONGODB_URI: mongodb://127.0.0.1:27017/job_hunt_ci
          MONGODB_DB_NAME: job_hunt_ci
          BETTER_AUTH_SECRET: ci-better-auth-secret-min-32-chars
          APP_ENCRYPTION_MASTER_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          APP_ENCRYPTION_KEY_VERSION: "1"
          CV_STORAGE_DEFAULT_PROVIDER: local
          LOCAL_PRIVATE_STORAGE_PATH: .data/private-uploads
          LOG_LEVEL: error
